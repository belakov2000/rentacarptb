# Английската и немската версия: същата страница на отделни адреси (заглавията се задават от edge функцията lang-pages).
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/de"
  to = "/de/"
  status = 301

[[redirects]]
  from = "/en/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/de/"
  to = "/index.html"
  status = 200

# Един адрес за сайта – без дублиране на rentacarptb.netlify.app в Google.
[[redirects]]
  from = "https://rentacarptb.netlify.app/*"
  to = "https://rentacar-ptb.com/:splat"
  status = 301
  force = true

# Изходният код и шаблонът на договора не са част от сайта – не се публикуват.
[[redirects]]
  from = "/contract/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/db/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

# Запазена незавършена работа (двуетапен процес) – не се публикува
[[redirects]]
  from = "/wip/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/server/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/mail/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/drizzle.config.ts"
  to = "/404"
  status = 404
  force = true

# Административен панел: един файл за всички раздели (/admin/dashboard, /admin/bookings …).
# Достъпът до данните се проверява на сървъра във всяка функция /api/admin/*.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

# Основният сайт: към външни сайтове (Google Fonts, картата, Meta) се изпраща само домейнът, без пътя и параметрите на адреса.
# Вградените карти имат собствен атрибут referrerpolicy. Админ панелът и /meta-pixel/ имат собствени, по-строги правила (no-referrer).
[[headers]]
  for = "/"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    # Браузърът проверява дали снимката е сменена, иначе ползва запазеното копие.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Meta Pixel: отделна страница, която сайтът вгражда в sandbox iframe само след съгласие за маркетингови бисквитки.
# CSP sandbox я изолира (отделен произход) дори ако бъде отворена директно.
[[headers]]
  for = "/meta-pixel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline' https://connect.facebook.net; img-src https://www.facebook.com; connect-src https://www.facebook.com https://connect.facebook.net; frame-ancestors 'self'; base-uri 'none'; form-action 'none'"
