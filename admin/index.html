<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Администрация – Rent a Car PTB</title>
<link rel="icon" href="/images/favicon.png">
<style>
:root{--acc:#ffb703;--ink:#1b2433;--line:#dde2ea;--muted:#5b6678;--navy:#0f1b2d;--navy2:#18283f;--soft:#eef1f5;--ok:#1a8f4c;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--soft)}
button,input{font:inherit}a{color:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 10px 30px rgba(15,27,45,.08);width:100%;max-width:420px}
.card h1{margin:0 0 6px;font-size:1.4rem}.card p{color:var(--muted);margin:0 0 16px}
label{display:block;font-weight:700;font-size:.88rem;margin:14px 0 6px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 22px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff}
.btn.acc{background:var(--acc);color:var(--navy)}.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.wide{width:100%;margin-top:18px}.btn:disabled{opacity:.6;cursor:wait}
.btn[hidden]{display:none}
.msg{margin-top:14px;padding:10px 14px;border-radius:12px;font-size:.92rem}.msg.err{background:#fde2e0;color:#8a1f17}.msg.ok{background:#d9f5e3;color:#11643a}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:14px;padding:0}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;margin:0 8px 22px}nav .brand img{width:34px;height:34px}
nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;text-decoration:none;color:#c9d2e0;font-weight:700;font-size:.95rem}
nav a:hover{background:var(--navy2);color:#fff}nav a.on{background:var(--acc);color:var(--navy)}
nav .who{margin:22px 8px 0;font-size:.82rem;color:#9aa6b8;word-break:break-all}
main{padding:26px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}header h2{margin:0;font-size:1.5rem}
.panel{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:14px;padding:14px}.stat small{color:var(--muted);display:block}.stat b{font-size:1.4rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:700}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:.8rem}.tag.ok{background:#d9f5e3;color:#11643a}.tag.bad{background:#fde2e0;color:#9b1c13}
.soon{color:var(--muted)}.warn{background:#fff4cc;color:#6b4e00;border-radius:14px;padding:12px 16px;margin-bottom:14px;font-weight:700}.warn.bad{background:#fde2e0;color:#8a1f17}.menu-btn{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tabs .btn{padding:9px 16px}.tabs .btn.on{background:var(--acc);color:var(--navy)}
.scroll{overflow-x:auto}.kv div{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--muted)}.kv b{text-align:right;overflow-wrap:anywhere}
.act h3{margin:0 0 6px;font-size:1.05rem}.act .hint{color:var(--muted);font-size:.88rem;margin:4px 0 10px}.opt{display:flex;gap:10px;align-items:center;font-weight:600;margin:8px 0}.opt input{width:auto}
textarea{width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit}
.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}.ask{border:2px solid var(--bad);border-radius:14px;padding:14px;margin-top:12px;background:#fff7f6}.ask[hidden]{display:none}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.row2 .btn{flex:1 1 180px}
select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}.bar>*{flex:0 1 auto}.bar input[type=search]{min-width:220px;flex:1 1 220px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}.muted{color:var(--muted)}small.muted{display:block}
.tag.wait{background:#fff4cc;color:#6b4e00}.tag.info{background:#e3ecfa;color:#1d3f73}.tag.gray{background:#e9edf2;color:#3b4554}
.kpi{display:block;text-decoration:none;background:var(--soft);border-radius:14px;padding:14px;border:2px solid transparent}.kpi:hover{border-color:var(--acc)}.kpi small{color:var(--muted);display:block}.kpi b{font-size:1.6rem}.kpi.alert{background:#fde2e0}.kpi.alert b{color:#8a1f17}
.evl{list-style:none;margin:0;padding:0}.evl li{padding:9px 0;border-bottom:1px solid var(--line)}.evl li:last-child{border:0}
.cal{border-collapse:separate;border-spacing:0;font-size:.82rem;min-width:100%}.cal th,.cal td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:4px;min-width:92px}
.cal th:first-child,.cal td:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:130px}.cal th.today{background:#fff4cc}.cal td.today{background:#fffbea}
.chip{display:block;text-decoration:none;border-radius:8px;padding:3px 6px;margin:2px 0;font-weight:700;line-height:1.25}.chip.booking{background:#0f1b2d;color:#fff}.chip.booking.done{background:#5b6678}.chip.booking.late{background:#c0392b}
.chip.block{background:repeating-linear-gradient(45deg,#e9edf2,#e9edf2 6px,#d5dbe3 6px,#d5dbe3 12px);color:#1b2433}.chip.pending{border:2px dashed #c79100;color:#6b4e00;background:#fff}.chip.buffer{background:#f3f5f9;color:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.legend .chip{display:inline-block}.agenda{display:none}
@media(max-width:700px){table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}table.cards tr:first-child{display:none}
table.cards tr{background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:10px}table.cards td{border:0;padding:3px 0}table.cards td[data-l]:before{content:attr(data-l) ": ";color:var(--muted);font-weight:700}
.cal-wrap{display:none}.agenda{display:block}.bar input[type=search]{min-width:0}}
@media(max-width:860px){.app{grid-template-columns:1fr}nav{position:fixed;inset:0 30% 0 0;z-index:5;transform:translateX(-105%);transition:transform .2s;height:100%}nav.open{transform:none}.menu-btn{display:inline-block}main{padding:16px}}
@media print{nav,.menu-btn,header .btn{display:none}.app{display:block}main{padding:0}.panel{break-inside:avoid}}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
// Административен панел. Всички данни идват от /api/admin/* – сървърът проверява входа и ролята "admin" при всяка заявка.
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const ID="/.netlify/identity";
async function api(path,opt={}){const r=await fetch(path,{credentials:"same-origin",cache:"no-store",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});
if(r.status===401){showLogin("Сесията изтече – влезте отново.");throw new Error("unauthorized")}
const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||("HTTP "+r.status)),{status:r.status,body:j});return j}

const SECTIONS=[["dashboard","Начално табло"],["bookings","Резервации"],["cars","Автомобили"],["calendar","Календар"],["payments","Плащания"],["reports","Финансови отчети"],["customers","Клиенти"],["contracts","Договори и документи"],["settings","Настройки и автоматизации"]];
let ME=null;

// ===== Вход, покана и нова парола =====
function authCard(inner){$("#root").innerHTML=`<div class="login"><form class="card" id="f" autocomplete="on"><img src="/images/logo.png" alt="Rent a Car PTB" style="height:44px;margin-bottom:12px">${inner}<div id="m"></div></form></div>`}
const say=(t,ok)=>{$("#m").innerHTML=t?`<div class="msg ${ok?"ok":"err"}">${esc(t)}</div>`:""};
function showLogin(note){
authCard(`<h1>Вход за администратори</h1><p>Само за поканени потребители с администраторски права.</p>
<label for="e">Имейл</label><input id="e" type="email" autocomplete="username" required>
<label for="p">Парола</label><input id="p" type="password" autocomplete="current-password" required>
<button class="btn wide">Вход</button><button type="button" class="link" id="fg">Забравена парола</button>`);
if(note)say(note);
$("#fg").onclick=showForgot;
$("#f").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;say("");
try{const r=await fetch("/api/admin/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#e").value,password:$("#p").value})});
const j=await r.json().catch(()=>({}));
if(r.ok){ME=j;return start()}
say({credentials:"Грешен имейл или парола.",forbidden:"Този потребител няма администраторски права.",locked:"Твърде много неуспешни опити. Опитайте след 15 минути.",unavailable:"Входът временно не е достъпен (Netlify Identity)."}[j.error]||"Входът не беше успешен.")}
catch(_){say("Няма връзка със сървъра.")}b.disabled=false}}
function showForgot(){authCard(`<h1>Нова парола</h1><p>Ще получите имейл с връзка за смяна на паролата.</p><label for="e">Имейл</label><input id="e" type="email" required><button class="btn wide">Изпрати връзка</button><button type="button" class="link" id="bk">Назад към входа</button>`);
$("#bk").onclick=()=>showLogin();
$("#f").onsubmit=async e=>{e.preventDefault();await fetch(ID+"/recover",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#e").value})}).catch(()=>{});say("Ако имейлът съществува, ще получите връзка.",true)}}
// Поканата и смяната на паролата пристигат с токен в адреса (#invite_token=… / #recovery_token=…)
function showSetPassword(kind,token){
authCard(`<h1>${kind==="invite"?"Приемане на поканата":"Задаване на нова парола"}</h1><p>Изберете парола с поне 10 знака.</p>
<label for="p">Парола</label><input id="p" type="password" autocomplete="new-password" minlength="10" required>
<label for="p2">Повторете паролата</label><input id="p2" type="password" autocomplete="new-password" minlength="10" required><button class="btn wide">Запази</button>`);
$("#f").onsubmit=async e=>{e.preventDefault();const p=$("#p").value;if(p!==$("#p2").value)return say("Паролите не съвпадат.");if(p.length<10)return say("Паролата трябва да е поне 10 знака.");
try{let r;if(kind==="invite")r=await fetch(ID+"/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"signup",token,password:p})});
else{const v=await fetch(ID+"/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"recovery",token})});const j=await v.json();if(!v.ok||!j.access_token)throw 0;
r=await fetch(ID+"/user",{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+j.access_token},body:JSON.stringify({password:p})})}
if(!r.ok)throw 0;history.replaceState(null,"",location.pathname);showLogin();say("Паролата е запазена – влезте с имейла и новата парола.",true)}
catch(_){history.replaceState(null,"",location.pathname);say("Връзката е невалидна или изтекла. Поискайте нова.")}}}

// ===== Панел =====
// Линк към снимка на документ от по-старо писмо (/api/documents/…): без вход сървърът праща тук с ?doc=; след вход – обратно към снимката
function start(){const doc=qs().get("doc");if(/^[a-f0-9]{64}$/.test(doc||""))return location.replace("/api/documents/"+doc);const sec=location.pathname.split("/")[2]||"dashboard";
$("#root").innerHTML=`<div class="app"><nav id="nav"><div class="brand"><img src="/images/logo-mark.png" alt="">Rent a Car PTB</div>
${SECTIONS.map(([k,t])=>`<a href="/admin/${k}" data-k="${k}">${esc(t)}</a>`).join("")}<a href="/admin/backups" data-k="backups">Резервни копия</a><a href="/admin/emails" data-k="emails">Имейли</a>
<div class="who">${esc(ME.email)}<br><button class="link" id="out" style="color:#c9d2e0">Изход</button></div></nav><main><div id="alerts"></div><div id="main"></div></main></div>`;
$("#nav").onclick=e=>{const a=e.target.closest("a[data-k]");if(!a)return;e.preventDefault();history.pushState(null,"",a.href);route()};
$("#out").onclick=async()=>{await fetch("/api/admin/logout",{method:"POST",credentials:"same-origin"}).catch(()=>{});ME=null;showLogin("Излязохте от панела.")};
route();alerts()}
// Предупреждения на всяка страница: тестова среда и неуспешно / остаряло резервно копие
// Средата идва от сървъра (/api/admin/me и /api/admin/login): production – без предупреждение; preview – тестова версия;
// unknown (или липсваща информация) – „Неизвестна среда“, без твърдение, че данните са тестови или изолирани.
function envWarn(){const k=ME.envKind||"unknown";if(k==="production")return"";
if(k==="preview")return`<div class="warn">Тестова среда (${esc(ME.env)}): отделни хранилища за файлове и отделна база за тази версия на сайта – промените тук не засягат реалния сайт.</div>`;
return`<div class="warn bad">Неизвестна среда: сървърът не получи от Netlify информация дали това е реалният сайт или тестова версия. Не приемайте, че базата и файловете са тестови или изолирани – действайте както в реалния сайт. Договорите и снимките на документите може да не се показват (търсят се в отделно хранилище).</div>`}
async function alerts(){let h=envWarn();
try{const {status}=await api("/api/admin/backups?status");if(status&&status.warning)h+=`<div class="warn bad">⚠ ${esc(status.warning)} <a href="/admin/backups" data-k="backups">Резервни копия →</a></div>`}catch(_){}
try{const {counts}=await api("/api/admin/emails");const u=counts.unknown||0,f=counts.failed||0;if(u||f)h+=`<div class="warn bad">⚠ Имейли: ${u?`${u} с неясен резултат`:""}${u&&f?", ":""}${f?`${f} неуспешни`:""}. <a href="/admin/emails" data-k="emails">Имейли →</a></div>`}catch(_){}
const el=$("#alerts");if(el){el.innerHTML=h;el.onclick=e=>{const a=e.target.closest("a[data-k]");if(!a)return;e.preventDefault();history.pushState(null,"",a.href);route()}}}
window.onpopstate=()=>ME&&route();
function route(){const k=location.pathname.split("/")[2]||"dashboard";$("#nav").classList.remove("open");
document.querySelectorAll("nav a[data-k]").forEach(a=>a.classList.toggle("on",a.dataset.k===k));
const title=(SECTIONS.find(s=>s[0]===k)||[k,k==="emails"?"Имейли – изискват внимание":"Резервни копия"])[1];
$("#main").innerHTML=`<header><div><button class="btn ghost menu-btn" onclick="document.getElementById('nav').classList.add('open')">☰ Меню</button><h2>${esc(title)}</h2></div></header><div id="view"></div>`;
(VIEWS[k]||soon)()}
function soon(){$("#view").innerHTML=`<div class="panel msg err">Няма такъв раздел.</div>`}
const VIEWS={dashboard,backups,emails,bookings,payments,reports,cars,calendar,customers,contracts,settings};
// ===== Общи помощни функции =====
// Дата и час на сървърен момент в Europe/Sofia: „16.10.2026, 17:29 ч.“ (лятното/зимното време се отчита от Intl); без дата – „Няма данни“
const fmtDT=d=>{if(!d)return"Няма данни";const t=new Date(d);if(isNaN(t))return"Няма данни";const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Sofia",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(t).map(x=>[x.type,x.value]));return`${p.day}.${p.month}.${p.year}, ${p.hour}:${p.minute} ч.`};
// Местна дата и час ["гггг-мм-дд","чч:мм"] (от сървъра) → „16.10.2026 17:29“
const lt=a=>a&&a[0]?dBG(a[0])+" "+a[1]:"";
const go=href=>{history.pushState(null,"",href);route()};
// Връзки с data-go се отварят в панела без презареждане
document.addEventListener("click",e=>{const a=e.target.closest("a[data-go]");if(!a||e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();go(a.getAttribute("href"))});
const loading=()=>`<div class="panel" role="status">Зарежда се…</div>`;
const failed=e=>e&&e.message==="unauthorized"?"":`<div class="panel msg err" role="alert">Неуспешно зареждане (${esc(e&&e.message)}). Опитайте отново.</div>`;
// Таблица, която на телефон се показва като карти (етикетите идват от заглавията)
function tbl(heads,rows){return`<table class="cards"><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${heads[i]?` data-l="${esc(heads[i])}"`:""}>${c}</td>`).join("")}</tr>`).join("")}</table>`}
function pager(total,page,size,href){const pages=Math.max(1,Math.ceil(total/size));if(pages<2)return`<div class="pager muted">${total} ${total===1?"запис":"записа"}</div>`;
return`<div class="pager"><span class="muted">${total} записа · страница ${page} от ${pages}</span>${page>1?`<a class="btn ghost" data-go href="${esc(href(page-1))}">← Предишна</a>`:""}${page<pages?`<a class="btn ghost" data-go href="${esc(href(page+1))}">Следваща →</a>`:""}</div>`}
const qs=()=>new URLSearchParams(location.search);
const withQ=(base,o)=>{const q=new URLSearchParams();Object.entries(o).forEach(([k,v])=>{if(v!=null&&v!=="")q.set(k,v)});const s=q.toString();return base+(s?"?"+s:"")};
const BTAG=r=>tag(r.status)+(r.returnedAt?` <span class="tag gray">приключен</span>`:r.handedOverAt?` <span class="tag info">предаден</span>`:"");
const contact=r=>`${esc(r.name)}<small class="muted"><a href="tel:${esc(String(r.phone||"").replace(/[^\d+]/g,""))}">${esc(r.phone)}</a>${r.email?" · "+esc(r.email):""}</small>`;
const pickT=r=>r.startDate?dBG(r.startDate)+" "+(r.startTime||""):"",endT=r=>r.endDate?dBG(r.endDate)+" "+(r.endTime||""):"";

// ===== Начално табло: реални данни; всеки показател отваря същите записи в „Резервации“ =====
const VIEW_BG={pending:"Чакащи заявки",pickup_today:"Получавания днес (планирани)",return_today:"Връщания днес (планирани)",active:"Текущи наеми (с отбелязано предаване)",overdue:"Просрочени връщания (без отбелязано връщане)",no_handover:"Минал час за получаване без отбелязано предаване",deposit_open:"Неприключен гаранционен депозит"};
const DUE_BG={inspection:"Технически преглед",insurance:"Застраховка",service:"Обслужване"};
async function dashboard(){const v=$("#view");v.innerHTML=loading();let d;try{d=await api("/api/admin/dashboard")}catch(e){v.innerHTML=failed(e);return}
const c=d.counts,em=(d.emails.failed||0)+(d.emails.unknown||0),alert=k=>["overdue","no_handover","deposit_open"].includes(k)&&c[k];
const kpi=k=>`<a class="kpi${alert(k)?" alert":""}" data-go href="/admin/bookings?view=${k}"><small>${esc(VIEW_BG[k])}</small><b>${c[k]}</b></a>`;
const ev=(l,f,empty)=>l.length?`<ul class="evl">${l.map(f).join("")}</ul>`:`<p class="muted">${empty}</p>`;
const line=(r,when,state)=>`<li><b>${esc(when)}</b> · ${esc(r.car)} · <a data-go href="/admin/bookings/${r.id}">№ ${ref(r.id)}</a> · ${state}<br>${contact(r)}</li>`;
const sec=(k,title,f,empty)=>`<div class="panel"><h3>${esc(title)} <small class="muted" style="display:inline">(${c[k]})</small></h3>${ev(d.lists[k],f,empty)}${c[k]>d.lists[k].length?`<p><a data-go href="/admin/bookings?view=${k}">Всички ${c[k]} →</a></p>`:""}</div>`;

// ===== Реклами: заявки и ROAS по кампания и вариант (/api/admin/ads/*) =====
const ND="Няма данни",dBG=s=>s?s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(0,4):"",isoDay=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);

async function reports(){const v=$("#view"),qs=new URLSearchParams(location.search),today=isoDay(new Date());

v.innerHTML=`<div class="panel"><h3>Реклами: заявки и ROAS</h3><form id="rf" class="grid"><div><label for="r-from">Заявки, създадени от</label><input id="r-from" type="date" value="${esc(from)}" required></div><div><label for="r-to">до (включително)</label><input id="r-to" type="date" value="${esc(to)}" required></div><div><label for="r-pu">Плащания, получени до (по избор)</label><input id="r-pu" type="date" value="${esc(pu)}"></div><div style="align-self:end"><button class="btn">Покажи</button></div></form>
<p class="hint">Кохорта: заявките, създадени в избрания период (българско време). По тях се отчитат всички получени плащания до посочената дата (по подразбиране – до момента), включително получени след края на периода. Приход = нетно получените плащания за наема и услугите след възстановяванията, без гаранционните депозити. Разход = само въведеният тук действителен разход, чийто период е изцяло в избрания период. <b>ROAS = нетен получен приход / рекламен разход</b> – възвръщаемост на рекламния разход, не печалба. Отчетът е по записаните UTM параметри (само при съгласие за маркетингови бисквитки) и не съвпада непременно с атрибуцията в Meta Ads Manager; заявките без съгласие са в реда „Няма записан източник“.</p></div>
<div class="panel scroll" id="rt">Зарежда се…</div>
<div class="panel"><h3>Действителен рекламен разход</h3><p class="hint">Въведете реално изразходваната сума от Meta Ads Manager за вариант и период (не планирания бюджет).</p>
<form id="sf" class="grid" data-key="${ukey()}"><div><label for="s-c">Кампания (utm_campaign)</label><input id="s-c" value="ptb_plovdiv_video_test" maxlength="100" required></div><div><label for="s-v">Вариант (utm_content)</label><input id="s-v" list="s-vl" maxlength="100"><datalist id="s-vl"><option value="video_a_woman">Видео А — жена</option><option value="video_b_man">Видео Б — мъж</option></datalist></div>
<div><label for="s-f">Период от</label><input id="s-f" type="date" required></div><div><label for="s-t">до (включително)</label><input id="s-t" type="date" required></div><div><label for="s-a">Изразходвано (EUR)</label><input id="s-a" inputmode="decimal" placeholder="напр. 17,35" required></div><div><label for="s-n">Бележка</label><input id="s-n" maxlength="500"></div><div style="align-self:end"><button class="btn">Запиши разхода</button></div></form><div id="sm"></div><div class="scroll" id="sl"></div></div>`;
$("#rf").onsubmit=e=>{e.preventDefault();const q=new URLSearchParams({from:$("#r-from").value,to:$("#r-to").value});if($("#r-pu").value)q.set("paidUntil",$("#r-pu").value);history.pushState(null,"","/admin/reports?"+q);reports()};
$("#sf").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;
// Ключът на формата остава същият до успешен запис – повторно изпращане (двоен клик, прекъсната връзка) не създава втори разход
try{const r=await api("/api/admin/ads/spend",{method:"POST",body:JSON.stringify({campaign:$("#s-c").value,content:$("#s-v").value,periodStart:$("#s-f").value,periodEnd:$("#s-t").value,amount:$("#s-a").value,note:$("#s-n").value,idempotencyKey:e.target.dataset.key})});e.target.dataset.key=ukey();$("#s-a").value="";$("#s-n").value="";$("#sm").innerHTML=`<div class="msg ok">${r.duplicate?"Разходът вече е записан (повторно изпращане).":"Разходът е записан."}</div>`;spendList();reportTable(from,to,pu)}
catch(err){if(err.message!=="unauthorized")$("#sm").innerHTML=`<div class="msg err">${err.message==="overlap"?`За тази кампания и вариант вече има разход за застъпващ се период: ${esc(((err.body||{}).conflicts||[]).map(c=>dBG(c.periodStart)+" – "+dBG(c.periodEnd)+" ("+eur(c.amountCents)+")").join("; "))}. Използвайте „Корекция“ в списъка по-долу или изберете период, който не се застъпва.`:esc({campaign:"Невалидна кампания (букви, цифри, _ . - до 100 знака).",content:"Невалиден вариант.",period:"Невалиден период.",amount:"Невалидна сума.",key_conflict:"Формата вече е използвана за друг запис – заредете страницата отново."}[err.message]||"Неуспешно ("+err.message+").")}</div>`}b.disabled=false};
reportTable(from,to,pu);spendList()}
async function reportTable(from,to,pu){const el=$("#rt");
try{const q=new URLSearchParams({from,to});if(pu)q.set("paidUntil",pu);const r=await api("/api/admin/ads/report?"+q);
el.innerHTML=`<p>Заявки, създадени <b>${esc(dBG(r.from))} – ${esc(dBG(r.to))}</b>; плащания, отчетени до <b>${esc(when(r.paidUntil))}</b>.</p>
${r.rows.length?`<table><tr><th>Кампания / вариант</th><th>Заявки</th><th>Потвърдени</th><th>С получено плащане за наема</th><th>Нетен получен приход</th><th>Рекламен разход</th><th>CPL (разход / заявки)</th><th>Цена за резервация с плащане</th><th>ROAS (приход / разход)</th></tr>
${r.rows.map(x=>`<tr><td><b>${esc(x.label)}</b>${x.campaign!=null?`<br><small>${esc(x.campaign)}${x.content?" · "+esc(x.content):""}${x.sources.length?" · "+esc(x.sources.join(", ")):""}</small>`:""}</td><td>${x.leads}</td><td>${x.confirmed}</td><td>${x.paid}</td><td>${esc(eur(x.revenueCents))}</td>${x.spendIncomplete?`<td colspan="4"><b>Непълен разход</b><br><small>Има разход, чийто период излиза извън избрания – показателите не се изчисляват.</small></td>`:`<td>${esc(x.spendCents==null?ND:eur(x.spendCents))}</td><td>${esc(x.cplCents==null?ND:eur(x.cplCents))}</td><td>${esc(x.costPerPaidCents==null?ND:eur(x.costPerPaidCents))}</td><td>${esc(roasTxt(x.roas))}</td>`}</tr>`).join("")}</table>`:"<p>Няма заявки и разходи в този период.</p>"}
<p class="hint">„Потвърдени“ включва и по-късно отменените резервации и тези с неявяване. „С получено плащане за наема“ – нетно получена сума за наема и услугите над 0 €.</p>
${r.partialSpend.length?`<div class="warn">Непълен разход – записи, чийто период само частично се застъпва с избрания (не се разпределят по дни): ${r.partialSpend.map(s=>esc(s.campaign+(s.content?" · "+s.content:"")+" ("+dBG(s.periodStart)+" – "+dBG(s.periodEnd)+", "+eur(s.amountCents)+")")).join("; ")}. За тези варианти разход, CPL, цена за резервация с плащане и ROAS не се изчисляват. Изберете период, който ги обхваща изцяло.</div>`:""}
${r.warnings.nonEurPayments||r.warnings.nonEurSpend?`<div class="warn">Записи в друга валута не са включени.</div>`:""}`}
catch(e){if(e.message!=="unauthorized")el.innerHTML=`<div class="msg err">${e.message==="period"?"Невалиден период.":"Неуспешно зареждане ("+esc(e.message)+")."}</div>`}}
const FIX_KEYS={};
async function spendList(){const el=$("#sl");try{const {rows}=await api("/api/admin/ads/spend");
el.innerHTML=rows.length?`<table><tr><th>Период</th><th>Кампания</th><th>Вариант</th><th>Сума</th><th>Бележка</th><th>Въведен от</th><th></th></tr>${rows.map(s=>`<tr><td>${esc(dBG(s.periodStart))} – ${esc(dBG(s.periodEnd))}</td><td>${esc(s.campaign)}</td><td>${esc(variant(s.content)||"—")}</td><td>${esc(eur(s.amountCents))}</td><td>${esc(s.note)}</td><td>${esc(s.createdBy)}</td><td>${s.replacesId?`<small>корекция на № ${esc(s.replacesId)}</small><br>`:""}<button class="btn ghost" data-fix="${s.id}" data-amount="${esc((s.amountCents/100).toFixed(2).replace(".",","))}">Корекция</button> <button class="btn ghost" data-del="${s.id}">Изтрий</button></td></tr>`).join("")}</table>`:"<p>Няма въведен разход.</p>";
el.onclick=async e=>{const f=e.target.closest("[data-fix]");

catch(err){f.disabled=false;if(err.message!=="unauthorized")alert({amount:"Невалидна сума.",already_replaced:"Записът вече е коригиран или изтрит – списъкът се обновява.",not_found:"Записът не е намерен."}[err.message]||"Неуспешно ("+err.message+").");spendList()}return}
const b=e.target.closest("[data-del]");if(!b||!confirm("Да изтрием ли този запис за разход?"))return;b.disabled=true;try{await api("/api/admin/ads/spend/"+b.dataset.del,{method:"POST",body:JSON.stringify({action:"delete"})});spendList();reports()}catch(_){b.disabled=false}}}

${check.problems&&check.problems.length?`<ul>${check.problems.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}

$("#tog").onclick=async e=>{const to=c.status==="active"?"inactive":"active";if(!confirm(to==="inactive"?"Да деактивираме ли автомобила? Новите заявки от сайта за него ще бъдат спрени и чакащите заявки няма да могат да бъдат потвърдени. Съществуващите резервации НЕ се променят.":"Да активираме ли автомобила? Той отново ще приема нови заявки."))return;e.target.disabled=true;

// ===== Календар: автомобили × дни; същите правила за заетост като сървърната проверка =====
const addD=(d,n)=>new Date(Date.parse(d+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
const WD=["нд","пн","вт","ср","чт","пт","сб"];
async function calendar(){const v=$("#view"),p=qs(),days=[7,14,31].includes(Number(p.get("days")))?Number(p.get("days")):14;v.innerHTML=loading();
const today=isoDay(new Date()),from=/^\d{4}-\d{2}-\d{2}$/.test(p.get("from")||"")?p.get("from"):today;let d;
try{d=await api(`/api/admin/calendar?from=${from}&days=${days}`)}catch(e){v.innerHTML=failed(e);return}
const ds=Array.from({length:days},(_,i)=>addD(from,i)),hrefP=f=>withQ("/admin/calendar",{from:f,days});
// Буфер: реалните 60-минутни интервали преди началото и след края, пресечени с конкретния ден (и през полунощ).
// Показва се само в дните, с които интервалът има ненулево пресичане – същото правило като сървърната проверка.
const MIN=(dd,tt)=>Date.parse(dd+"T"+tt+":00Z")/6e4,HM=m=>{const x=((m%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};
function bufSegs(e,day){if(!e.bufferFrom)return[];const d0=MIN(day,"00:00"),d1=d0+1440,out=[];
for(const[a,b]of[[MIN(...e.bufferFrom),MIN(...e.from)],[MIN(...e.to),MIN(...e.bufferUntil)]]){const lo=Math.max(a,d0),hi=Math.min(b,d1);if(hi>lo)out.push(HM(lo)+"–"+(hi===d1?"24:00":HM(hi)))}return out}
const chipFor=(e,day)=>{const inMain=e.from[0]<=day&&day<=e.to[0];const part=inMain?(e.from[0]===day&&e.to[0]===day?e.from[1]+"–"+e.to[1]:e.from[0]===day?"от "+e.from[1]:e.to[0]===day?"до "+e.to[1]:"цял ден"):"";
const buf=bufSegs(e,day).map(x=>`<span class="chip buffer" title="Буфер 60 мин.">буфер ${esc(x)}</span>`).join("");
if(!inMain)return buf;
return mainChip(e,part)+buf};
const mainChip=(e,part)=>{
if(e.type==="block")return`<a class="chip block" data-go href="/admin/cars/${esc(e.carId)}" title="${esc(BLOCK_BG[e.kind]+(e.note?": "+e.note:""))}">${esc(BLOCK_BG[e.kind])} · ${esc(part)}</a>`;
if(e.type==="pending")return`<a class="chip pending" data-go href="/admin/bookings/${e.id}" title="Непотвърдена заявка – не запазва автомобила">? № ${ref(e.id)} · ${esc(part)}</a>`;
return`<a class="chip booking${e.returned?" done":e.overdue?" late":""}" data-go href="/admin/bookings/${e.id}" title="${esc(e.name)}${e.returned?" – върнат":e.overdue?" – просрочено връщане":""}">№ ${ref(e.id)} · ${esc(part)}${e.returned?" ✓":""}</a>`};
const evs=(carId,day)=>d.events.filter(e=>e.carId===carId).sort((a,b)=>(a.type==="pending")-(b.type==="pending")).map(e=>chipFor(e,day)).join("");
const nav=`<div class="bar"><a class="btn ghost" data-go href="${esc(hrefP(addD(from,-days)))}">← Назад</a><a class="btn acc" data-go href="${esc(hrefP(today))}">Днес</a><a class="btn ghost" data-go href="${esc(hrefP(addD(from,days)))}">Напред →</a>
<select id="cd" aria-label="Период">${opts({7:"7 дни",14:"14 дни",31:"31 дни"},String(days))}</select><input type="date" id="cf" value="${esc(from)}" aria-label="От дата"><span class="muted">${esc(dBG(d.from))} – ${esc(dBG(d.to))}</span></div>
<div class="legend"><span class="chip booking">Потвърдена резервация</span><span class="chip booking done">Приключен (реално върнат)</span><span class="chip booking late">Просрочено връщане</span><span class="chip block">Блокиран период</span><span class="chip pending">? Непотвърдена заявка (не запазва автомобила)</span><span class="chip buffer">Буфер ${d.buffer} мин.</span></div>`;
v.innerHTML=`<div class="panel">${nav}<div class="scroll cal-wrap"><table class="cal"><tr><th>Автомобил</th>${ds.map(x=>`<th class="${x===d.today?"today":""}">${WD[new Date(x+"T12:00:00Z").getUTCDay()]} ${esc(dBG(x).slice(0,5))}</th>`).join("")}</tr>
${d.cars.map(c=>`<tr><td><a data-go href="/admin/cars/${esc(c.id)}"><b>${esc(c.brand+" "+c.model)}</b></a><small class="muted">${esc(c.reg)}${c.status!=="active"?" · неактивен":""}</small></td>${ds.map(x=>`<td class="${x===d.today?"today":""}">${evs(c.id,x)}</td>`).join("")}</tr>`).join("")}</table></div>
<div class="agenda">${ds.map(x=>{const rows=d.cars.map(c=>{const h=evs(c.id,x);return h?`<div style="margin:6px 0"><b>${esc(c.brand+" "+c.model)}</b>${h}</div>`:""}).join("");return`<div class="panel" style="background:var(--soft)${x===d.today?";border:2px solid var(--acc)":""}"><h3>${WD[new Date(x+"T12:00:00Z").getUTCDay()]} ${esc(dBG(x))}</h3>${rows||'<p class="muted">Всички автомобили са свободни.</p>'}</div>`}).join("")}</div>
<p class="hint">Часовете са по българско време. Потвърдените резервации заемат автомобила до реалното връщане (ако е отбелязано) или до договорения край; просрочен наем без отбелязано връщане – до момента. Отменени и отказани заявки не се показват.</p></div>`;
$("#cd").onchange=()=>go(withQ("/admin/calendar",{from,days:$("#cd").value}));$("#cf").onchange=()=>$("#cf").value&&go(hrefP($("#cf").value))}

<div class="panel"><h3>${esc(c.name)}</h3><form id="cu" class="grid"><div><label for="c-n">Име</label><input id="c-n" value="${esc(c.name)}" maxlength="120" required></div><div><label for="c-p">Телефон</label><input id="c-p" value="${esc(c.phone)}" maxlength="40"></div><div><label for="c-e">Имейл</label><input id="c-e" type="email" value="${esc(c.email)}" maxlength="200"></div></form>
<label for="c-note">Вътрешни бележки (не се изпращат на клиента)</label><textarea id="c-note" maxlength="2000">${esc(c.note)}</textarea><p class="row2"><button class="btn" id="csave">Запази</button></p>
<p class="hint">Създаден на ${esc(fmtDT(c.createdAt))} от ${esc(c.createdBy)}${c.updatedAt?` · последна промяна ${esc(fmtDT(c.updatedAt))} от ${esc(c.updatedBy)}`:""}.</p></div>
<div class="panel scroll"><h3>Свързани резервации</h3><div class="grid" style="margin-bottom:10px"><div class="stat"><small>Реално получено за наеми (нетно, без гаранционни депозити)</small><b>${esc(eur(d.totalRentalNetCents))}</b></div></div>
${d.bookings.length?tbl(["№","Създадена на","Статус","Автомобил","Получаване","Получено за наема",""],d.bookings.map(b=>[`<a data-go href="/admin/bookings/${b.id}">${ref(b.id)}</a>`,esc(fmtDT(b.createdAt)),BTAG(b),esc(b.car),esc(b.pickup),esc(eur(b.rentalNetCents))+(b.securityHeldCents>0?`<small class="muted">депозит ${esc(eur(b.securityHeldCents))}</small>`:""),`<button class="btn ghost" data-unlink="${b.id}">Премахни връзката</button>`])):"<p>Няма свързани резервации.</p>"}</div>
<div class="panel scroll"><h3>Възможни съвпадения (не са свързани)</h3><p class="hint">Резервации без профил със същия имейл, телефон или име. Свържете само ако сте сигурни, че е същият човек.</p>
${d.matches.length?tbl(["№","Създадена на","Клиент","Съвпадение","Статус",""],d.matches.map(b=>[`<a data-go href="/admin/bookings/${b.id}">${ref(b.id)}</a>`,esc(fmtDT(b.createdAt)),contact(b),esc(b.match.map(m=>MATCH_BG[m]).join(", ")),tag(b.status),`<button class="btn ghost" data-link="${b.id}">Свържи</button>`])):"<p>Няма възможни съвпадения.</p>"}</div>
<div class="panel"><h3>История</h3><ul>${d.events.map(e=>`<li>${esc(fmtDT(e.at))} – ${esc(EV[e.action]||(e.action==="customer.update"?"Промяна на профила ("+(e.details.changed||[]).join(", ")+")":e.action))}${e.bookingId?` (№ ${ref(e.bookingId)})`:""} – ${esc(e.actor)}</li>`).join("")||"<li>Няма записи.</li>"}</ul></div>`;
$("#csave").onclick=async e=>{e.target.disabled=true;try{await api("/api/admin/customers/"+id,{method:"POST",body:JSON.stringify({action:"update",name:$("#c-n").value,phone:$("#c-p").value,email:$("#c-e").value,note:$("#c-note").value})});customer(id,"Профилът е записан.",true)}catch(err){e.target.disabled=false;if(err.message!=="unauthorized")customer(id,err.message==="invalid"?"Невалидно име или имейл.":"Неуспешно ("+err.message+").",false)}};
v.onclick=async e=>{const l=e.target.closest("[data-link],[data-unlink]");if(!l)return;const link=!!l.dataset.link;if(!confirm(link?"Сигурни ли сте, че тази резервация е на същия клиент? Тя ще бъде свързана с профила.":"Да премахнем ли връзката на резервацията с профила? Резервацията не се променя."))return;l.disabled=true;
try{await api("/api/admin/customers/"+id,{method:"POST",body:JSON.stringify({action:link?"link":"unlink",bookingId:l.dataset.link||l.dataset.unlink})});customer(id,link?"Резервацията е свързана.":"Връзката е премахната.",true)}catch(err){if(err.message!=="unauthorized")customer(id,err.message==="linked_other"?"Резервацията вече е свързана с друг профил.":"Неуспешно ("+err.message+").",false)}}}

// ===== Договори и документи: файловете се получават само след вход (заявка с бисквитката) – без публични линкове =====
async function contracts(){const id=location.pathname.split("/")[3];if(id)return contract(id);const v=$("#view"),p=qs(),q=p.get("q")||"",page=Number(p.get("page"))||1;v.innerHTML=loading();
try{const r=await api(withQ("/api/admin/contracts",{q,page}));
v.innerHTML=`<form class="bar" id="kf"><input type="search" id="kq" value="${esc(q)}" placeholder="Търсене: номер на резервация, клиент или автомобил" aria-label="Търсене"><button class="btn">Търси</button></form>
<div class="panel scroll">${r.rows.length?tbl(["№","Създадена на","Клиент","Автомобил","Договор","Документи",""],r.rows.map(b=>[`<b>${ref(b.id)}</b>`,esc(fmtDT(b.createdAt)),esc(b.name),esc(b.car),b.versions?`${b.versions} ${b.versions===1?"версия":"версии"} (последна v${b.latest})`:`<span class="muted">без версии – проверете</span>`,b.documentsCount==null?`<span class="muted">няма запис</span>`:String(b.documentsCount),`<a class="btn ghost" data-go href="/admin/contracts/${b.id}">Отвори</a>`])):`<p>${q?"Няма резервации, които отговарят на търсенето.":"Няма резервации."}</p>`}${pager(r.total,r.page,r.pageSize,n=>withQ("/admin/contracts",{q,page:n}))}</div>`;
$("#kf").onsubmit=e=>{e.preventDefault();go(withQ("/admin/contracts",{q:$("#kq").value.trim()}))}}
catch(e){v.innerHTML=failed(e)}}
// Изтегляне с проверка на отговора – липсващ файл дава съобщение, а не празно „успешно“ изтегляне
async function fetchFile(url){const r=await fetch(url,{credentials:"same-origin",cache:"no-store"});if(r.status===401){showLogin("Сесията изтече – влезте отново.");throw new Error("unauthorized")}
if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||"HTTP "+r.status)}const name=(/filename="([^"]+)"/.exec(r.headers.get("Content-Disposition")||"")||[])[1]||"file";return{blob:await r.blob(),name}}
async function contract(id){const v=$("#view");v.innerHTML=loading();let d;try{d=await api("/api/admin/contracts/"+id)}catch(e){v.innerHTML=e.status===404?`<div class="panel msg err">Резервацията не е намерена.</div>`:failed(e);return}
const b=d.booking;
v.innerHTML=`<p><a data-go href="/admin/contracts">← Всички договори</a> · <a data-go href="/admin/bookings/${b.id}">Резервация № ${ref(b.id)}</a></p><div id="km"></div>
<div class="panel"><h3>Договор за наем – № ${ref(b.id)}</h3><p>${esc(b.name)} · ${esc(b.car)} · ${esc(b.pickup)} → ${esc(b.dropoff)}</p>
<p class="hint">Системата генерира документите за печат и не съхранява доказателство за подпис. Генериран документ не означава подписан, а липсата на запис не означава, че не е подписан.</p>
${d.versions.length?tbl(["Версия","Създадена","Основание","Файл",""],d.versions.map(x=>[`<b>v${x.version}</b>${x.current?` <span class="tag ok">актуална</span>`:""}`,esc(fmtDT(x.createdAt))+`<small class="muted">${esc(x.createdBy==="customer"?"заявка от сайта":x.createdBy==="owner-link"?"линк от имейла":x.createdBy)}</small>`,esc(x.reason),x.available?`${x.signStatus==="awaiting"?"Генерирана — очаква подписване":"Няма записани данни за подписване"}<small class="muted">${esc(x.fileName)}</small>`:`<span class="tag bad">файлът липсва</span>`,x.available?`<button class="btn ghost" data-dl="${x.version}">Изтегли</button>`:""])):d.current?`<p>Договор отпреди историята на версиите${d.current.legacy?"":""}. <button class="btn ghost" data-dl="current">Изтегли</button></p>`:"<p>Няма генериран договор за тази резервация.</p>"}
${d.versions.length&&d.current&&!d.versions.some(x=>x.current)?`<p class="hint">Актуалният файл не е отбелязан с версия. <button class="btn ghost" data-dl="current">Изтегли актуалния файл</button></p>`:""}</div>
<div class="panel"><h3>Приложени документи (снимки)</h3>${d.documents==null?`<p class="muted">Няма запис за приложени снимки към тази заявка в системата (по-стари заявки – линковете са само в имейла до фирмата).</p>`:d.documents.length?`<ul class="evl">${d.documents.map(x=>`<li>${esc(x.label)} – ${x.available?`<button class="btn ghost" data-doc="${x.id}">Покажи</button>`:`<span class="tag bad">файлът липсва</span>`}<div id="doc-${x.id}"></div></li>`).join("")}</ul><p class="hint">Отварянето на снимка се записва в историята на резервацията.</p>`:"<p>Няма приложени снимки.</p>"}</div>`;
v.onclick=async e=>{const dl=e.target.closest("[data-dl]"),dc=e.target.closest("[data-doc]");if(!dl&&!dc)return;const t=dl||dc;t.disabled=true;
try{if(dl){const f=await fetchFile(`/api/admin/contracts/${id}/file?v=${dl.dataset.dl}`);const u=URL.createObjectURL(f.blob),a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
else{const f=await fetchFile(`/api/admin/contracts/${id}/document/${dc.dataset.doc}`);$("#doc-"+dc.dataset.doc).innerHTML=`<img alt="Снимка на документ" style="max-width:100%;border-radius:12px;margin-top:8px" src="${URL.createObjectURL(f.blob)}">`}$("#km").innerHTML=""}
catch(err){if(err.message!=="unauthorized")$("#km").innerHTML=`<div class="msg err">${err.message==="missing"?"Файлът липсва в хранилището – не е изтеглен.":"Неуспешно ("+esc(err.message)+")."}</div>`}t.disabled=false}}

// ===== Настройки и автоматизации =====
const REM_BG={pickup24:"Първо напомняне преди получаване",handover:"Инструкции за предаването (преди получаване)",return24:"Първо напомняне преди връщане",returnSoon:"Второ напомняне преди връщане"};
const JOB_INFO=j=>!j.last?`<span class="tag wait">още няма запис за изпълнение</span>`:j.last.warning?`<span class="tag bad">${esc(j.last.warning)}</span>`:`последно: ${esc(fmtDT(j.last.at))}${j.last.sent!=null?` · изпратени ${j.last.sent}, неуспешни ${j.last.failed}`:j.last.retried!=null?` · повторни опити ${j.last.retried}`:""}`;
async function settings(msg,ok){const v=$("#view");if(!msg)v.innerHTML=loading();let d;try{d=await api("/api/admin/settings")}catch(e){v.innerHTML=failed(e);return}
const r=d.reminders.value,L=d.limits,H=d.hours,WDN=["Неделя","Понеделник","Вторник","Сряда","Четвъртък","Петък","Събота"];
v.innerHTML=`${msg?`<div class="msg ${ok?"ok":"err"}" role="status">${esc(msg)}</div>`:""}
<div class="panel"><h3>Действащи настройки</h3><div class="kv"><div><span>Часова зона</span><b>${esc(d.timezone)} (българско време, с лятно и зимно време)</b></div><div><span>Буфер между наемите</span><b>${d.bufferMinutes} минути</b></div><div><span>Пощенска услуга</span><b>${!d.mailAllowed?"изключена в тази среда (тестова версия) – писмата не се изпращат":d.mailConfigured?"настроена":"не е настроена – писмата не се изпращат"}</b></div>
${[1,2,3,4,5,6,0].map(i=>`<div><span>${WDN[i]}</span><b>${esc(H[i][0])} – ${esc(H[i][1])}</b></div>`).join("")}</div>
<p class="hint">Часовата зона, буферът и работното време са общи за сайта, проверката за наличност и панела и се променят само с нова версия на сайта.</p></div>
<div class="panel act"><h3>Напомняния до клиента</h3><p class="hint">Само за потвърдени резервации. Отменени, отказани и неявили се не получават напомняния; при удължаване напомнянето е за новия край. Всяко писмо се изпраща най-много веднъж; ако времето му е минало (напр. при включване по-късно), не се изпраща. Не се изпращат маркетингови писма.</p>
<form id="rf2">${Object.keys(REM_BG).map(k=>`<div class="grid" style="align-items:end;border-bottom:1px solid var(--line);padding:6px 0"><label class="opt"><input type="checkbox" id="r-${k}"${r[k].enabled?" checked":""}> ${esc(REM_BG[k])}</label><div><label for="h-${k}">Часове преди (${L[k][0]}–${L[k][1]})</label><input id="h-${k}" type="number" min="${L[k][0]}" max="${L[k][1]}" step="1" value="${r[k].hours}" required></div></div>`).join("")}
<p class="hint">Молбата за отзив (2 часа след края на наема) не се настройва.</p><button class="btn">Запази</button></form>
<p class="hint">${d.reminders.saved?`Последна промяна: ${esc(fmtDT(d.reminders.updatedAt))} от ${esc(d.reminders.updatedBy)}.`:"Действат стойностите по подразбиране (24 ч. и 3 ч.)."}</p></div>
<div class="panel"><h3>Автоматични задачи</h3>${tbl(["Задача","График","Състояние"],d.jobs.map(j=>[esc(j.label),esc(j.schedule==="*/15 * * * *"?"на всеки 15 минути":j.schedule==="*/5 * * * *"?"на всеки 5 минути":"всеки час"),JOB_INFO(j)]))}</div>`;
$("#rf2").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;const reminders=Object.fromEntries(Object.keys(REM_BG).map(k=>[k,{enabled:$("#r-"+k).checked,hours:Number($("#h-"+k).value)}]));
try{await api("/api/admin/settings",{method:"POST",body:JSON.stringify({reminders})});settings("Напомнянията са записани и се използват от следващото изпълнение.",true)}catch(err){b.disabled=false;if(err.message!=="unauthorized")settings(err.message==="order"?"Първото напомняне трябва да е повече часове преди второто.":err.message==="invalid"?"Невалидни часове.":"Неуспешно ("+err.message+").",false)}}}

// ===== Начало =====
(async()=>{const h=new URLSearchParams(location.hash.slice(1));
if(h.get("invite_token"))return showSetPassword("invite",h.get("invite_token"));
if(h.get("recovery_token"))return showSetPassword("recovery",h.get("recovery_token"));
try{const r=await fetch("/api/admin/me",{credentials:"same-origin",cache:"no-store"});if(r.ok){ME=await r.json();return start()}
showLogin(r.status===403?"Този потребител няма администраторски права.":"")}catch(_){showLogin("Няма връзка със сървъра.")}})();
</script>
</body>
</html>
